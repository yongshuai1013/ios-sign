name: Build Frontend Test

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/pairing/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: |
          cd app && npm install
          # 讓倉庫根 src/pairing 下的文件也能解析到 app/node_modules
          ln -sfn "$PWD/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Build
        run: cd app && npx vite build
